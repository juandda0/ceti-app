appId: com.juanndda.ceti
name: CRUD Mi dinero
---
# Requiere la sesión local de estudiante usada por los flujos autenticados.
- launchApp
- tapOn: 'Mi dinero'
- tapOn: 'Metas'
- tapOn: 'Nueva meta'
- tapOn: 'Nombre de la meta'
- inputText: 'Bicicleta'
- tapOn: 'Objetivo en pesos'
- inputText: '500000'
- tapOn: 'Guardar'
- tapOn: 'Aporte'
- tapOn: 'Monto en pesos'
- inputText: '50000'
- tapOn: 'Descripción'
- inputText: 'Ahorro bici'
- tapOn: 'Bicicleta'
- tapOn: 'Guardar'
- tapOn: 'Actividad'
- tapOn: 'Editar Ahorro bici'
- tapOn: 'Monto en pesos'
- eraseText
- inputText: '40000'
- tapOn: 'Guardar'
- tapOn: 'Metas'
- tapOn: 'Eliminar Bicicleta'
- tapOn: 'Eliminar meta'
- tapOn: 'Resumen'
- assertVisible: 'Sin asignar'
- assertVisible: '$40.000'
- tapOn: 'Gasto'
- tapOn: 'Monto en pesos'
- inputText: '10000'
- tapOn: 'Descripción'
- inputText: 'Almuerzo'
- tapOn: 'Guardar'
- tapOn: 'Actividad'
- tapOn: 'Editar Almuerzo'
- tapOn: 'Monto en pesos'
- eraseText
- inputText: '8000'
- tapOn: 'Guardar'
- tapOn: 'Eliminar Almuerzo'
- tapOn: 'Eliminar'
- tapOn: 'Resumen'
- assertVisible: '$40.000'
